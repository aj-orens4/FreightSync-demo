<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log — FreightSync</title><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body><div class="app-shell"><aside class="sidebar" id="app-sidebar"></aside><div class="main"><div class="topbar" id="app-topbar"></div><div class="content"><div class="audit-summary-grid"><div class="recovery-stat"><span>Visible events</span><strong id="audit-count">—</strong><small>Matching the selected filters</small></div><div class="recovery-stat"><span>Sign-in events</span><strong id="audit-logins">—</strong><small>In the current page</small></div><div class="recovery-stat"><span>Security events</span><strong id="audit-security">—</strong><small>In the current page</small></div></div><div class="panel"><div class="toolbar"><div><h2>Audit Log</h2><p class="settings-desc">Security and change history recorded by FreightSync.</p></div><div class="filters"><select id="audit-entity"><option value="">All entities</option><option value="USER">Users &amp; sign-ins</option><option value="SYSTEM">System &amp; backups</option><option value="ROUTE">Routes</option><option value="SCHEDULE">Schedules</option><option value="SOP">SOPs</option><option value="TARIFF">Tariffs</option></select><select id="audit-archived"><option value="0">Active logs</option><option value="1">Archived logs</option></select><button class="btn outline" id="audit-search">Filter</button></div></div><table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th><th>IP</th><th>Action</th></tr></thead><tbody id="audit-body"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table><div class="audit-pager"><button class="btn outline small" id="audit-prev">← Previous</button><span id="audit-page-label">Page 1</span><button class="btn outline small" id="audit-next">Next →</button></div></div></div></div></div><div class="toast" id="toast"></div><script src="js/api.js"></script><script src="js/reminders.js"></script><script src="js/audit.js"></script></body></html>
