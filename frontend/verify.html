<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2-step verification — FreightSync</title><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body class="verify-page"><main class="verify-card"><div class="verify-logo">FS</div><h1>2-step verification</h1><p>To keep your account safe, we need to check that this is really you.</p><hr><div class="verify-method"><span class="mail-icon">✉</span><div><strong>Verify it's you by email</strong><p>We've sent a 6-digit code to <b id="masked-email">your registered email</b>.</p></div></div><form id="verify-form"><label for="code">Enter code</label><input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required><div class="resend-line"><button class="resend-link" type="button" id="resend-code" disabled>Resend code in 60s</button><span id="resend-status" role="status" aria-live="polite"></span></div><label class="trust-row"><input type="checkbox" id="trust-device"> <span>Trust this device for 10 days.</span></label><button class="btn accent" type="submit">Continue</button><button class="btn outline cancel-login" type="button" id="cancel-login">Cancel login</button><div class="login-error" id="verify-error"></div></form><p class="verify-help" id="dev-hint"></p></main><script src="js/api.js"></script><script src="js/verify.js"></script></body></html>
